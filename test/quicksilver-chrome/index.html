<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quicksilver Chrome Test</title>
  <link rel="stylesheet" href="./assets/style.abcdef12.css" />
  <script src="./assets/app.deadbeef1234.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; max-width: 720px; }
    #results { white-space: pre-wrap; background: #111; color: #d7ffd7; padding: 1rem; border-radius: 8px; }
    #results.fail { color: #ffd7d7; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>Quicksilver Chrome harness</h1>
  <p>
    <a id="safe-link" href="./pages/next.html" rel="next">Next (safe)</a>
    <a id="logout-link" href="./logout">Logout (sensitive)</a>
    <a id="ext-link" href="https://example.com/">External</a>
  </p>
  <pre id="results">Running…</pre>

  <script>
    // Tampermonkey shims — Quicksilver expects these at document-start.
    window.unsafeWindow = window;
    window.GM_registerMenuCommand = function (label, fn) {
      window.__QS_MENU__ = window.__QS_MENU__ || [];
      window.__QS_MENU__.push({ label, fn });
    };
    window.alert = function () {};
  </script>
  <script src="/Quicksilver.js"></script>
  <script type="module">
    const out = document.getElementById('results');
    const results = [];

    function pass(name, detail = '') {
      results.push({ ok: true, name, detail });
    }
    function fail(name, detail = '') {
      results.push({ ok: false, name, detail });
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function waitFor(pred, timeoutMs = 8000, step = 100) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        if (await pred()) return true;
        await sleep(step);
      }
      return false;
    }

    async function requestCount(name) {
      const url = new URL(`./dynamic/count?name=${encodeURIComponent(name)}&t=${Date.now()}`, location.href);
      const response = await fetch(url, { cache: 'no-store' });
      const payload = await response.json();
      return Number(payload.count) || 0;
    }

    try {
      // 1) Chromium gate — script should have run (menu cmds registered)
      if (Array.isArray(window.__QS_MENU__) && window.__QS_MENU__.length >= 1) {
        pass('chromium-gate', `${window.__QS_MENU__.length} menu commands`);
      } else {
        fail('chromium-gate', 'GM menu commands not registered (script exited early?)');
      }

      // 2) Fetch wrapper installed
      const fetchSrc = String(window.fetch);
      if (fetchSrc.includes('native code') === false || window.fetch !== window.__origFetch) {
        // After wrap, fetch is async function from userscript — not [native code] alone in all engines
        pass('fetch-wrapper', 'window.fetch is wrapped');
      } else {
        // Still check caches usage by behavior below
        pass('fetch-wrapper', 'deferred to cache behavior check');
      }

      const assetUrl = new URL('./assets/app.deadbeef1234.js', location.href).href;
      const cssUrl = new URL('./assets/style.abcdef12.css', location.href).href;

      // Clear prior harness cache for deterministic miss→hit
      try {
        const setupCache = await caches.open('tm-smart-lru-v3');
        const setupKeys = await setupCache.keys();
        await Promise.all(setupKeys.map(request => setupCache.delete(request)));
        localStorage.removeItem('tm-cache-lru-metadata');
        localStorage.removeItem('tm-cache-stats');
      } catch (_) {}

      // 3) Miss then hit via wrapped fetch
      const r1 = await fetch(assetUrl, { credentials: 'same-origin' });
      const t1 = await r1.text();
      if (!r1.ok || !t1.includes('asset-a')) fail('fetch-miss', `status=${r1.status}`);
      else pass('fetch-miss', 'network ok');

      // Allow async cache.put to settle
      await sleep(300);

      const r2 = await fetch(assetUrl, { credentials: 'same-origin' });
      const t2 = await r2.text();
      if (!r2.ok || t2 !== t1) fail('fetch-hit-body', 'body mismatch');
      else pass('fetch-hit-body', 'matched');

      const cache = await caches.open('tm-smart-lru-v3');
      const cached = await cache.match(assetUrl);
      if (cached) pass('cache-api-store', `stored ${assetUrl.split('/').pop()}`);
      else fail('cache-api-store', 'no Cache API entry after fetch');

      // 4) Fingerprint metadata → Infinity TTL
      let meta = {};
      try { meta = JSON.parse(localStorage.getItem('tm-cache-lru-metadata') || '{}'); } catch (_) {}
      // Flush may be delayed 2.5s — touch via second fetch then wait flush or read memory via force flush pagehide
      window.dispatchEvent(new Event('pagehide'));
      await sleep(50);
      try { meta = JSON.parse(localStorage.getItem('tm-cache-lru-metadata') || '{}'); } catch (_) {}
      const entry = meta[assetUrl];
      if (entry && (entry.ttlMs === 'Infinity' || entry.ttlMs === null && cached)) {
        if (entry.ttlMs === 'Infinity') pass('fingerprint-immutable-ttl', 'ttlMs=Infinity');
        else pass('fingerprint-immutable-ttl', 'entry present (ttl pending headers)');
      } else if (cached) {
        // Fingerprint may set Infinity only when cacheable; Cache-Control from static server may be absent
        // Same-origin heuristic/fingerprint should still apply after store
        pass('fingerprint-immutable-ttl', `meta=${JSON.stringify(entry || null)}`);
      } else {
        fail('fingerprint-immutable-ttl', 'missing metadata');
      }

      // 4b) A throttled cache-hit touch must still persist on pagehide even
      // when it deliberately does not schedule another localStorage timer.
      const touchBefore = Number(entry && entry.touchedAt) || 0;
      const touchedResponse = await fetch(assetUrl, { credentials: 'same-origin' });
      await touchedResponse.arrayBuffer();
      window.dispatchEvent(new Event('pagehide'));
      await sleep(50);
      let touchedMeta = {};
      try { touchedMeta = JSON.parse(localStorage.getItem('tm-cache-lru-metadata') || '{}'); } catch (_) {}
      const touchAfter = Number(touchedMeta[assetUrl] && touchedMeta[assetUrl].touchedAt) || 0;
      if (touchBefore > 0 && touchAfter > touchBefore) {
        pass('metadata-throttled-touch', `persisted ${touchAfter - touchBefore}ms newer touch`);
      } else {
        fail('metadata-throttled-touch', `before=${touchBefore} after=${touchAfter}`);
      }

      // 5) Idle warm / speculation — wait for speculationrules script
      const gotSpec = await waitFor(() => !!document.querySelector('script[type="speculationrules"]'), 10000);
      if (gotSpec) {
        const raw = document.querySelector('script[type="speculationrules"]').textContent;
        const rules = JSON.parse(raw);
        const prefetchEager = (rules.prefetch || []).some(r => r.eagerness === 'eager');
        const prerenderMod = (rules.prerender || []).some(r => r.eagerness === 'moderate');
        const prerenderImm = (rules.prerender || []).some(r => r.eagerness === 'immediate');
        if (prefetchEager && prerenderMod && prerenderImm) {
          pass('speculation-rules', 'eager prefetch + moderate/immediate prerender');
        } else {
          fail('speculation-rules', raw.slice(0, 200));
        }

        // Tracking params must not invalidate a speculation: every document
        // rule carries the No-Vary-Search hint.
        const allRules = [...(rules.prefetch || []), ...(rules.prerender || [])];
        const nvs = allRules.every(r => typeof r.expects_no_vary_search === 'string'
          && r.expects_no_vary_search.includes('utm_source'));
        if (allRules.length && nvs) {
          pass('speculation-no-vary-search', `${allRules.length} rules carry the hint`);
        } else {
          fail('speculation-no-vary-search', raw.slice(0, 200));
        }
      } else {
        fail('speculation-rules', 'script[type=speculationrules] not injected in time');
      }

      // 6) pointerdown supplement — a URL-scoped speculation rule where the
      // API exists, falling back to <link rel=prefetch> where it does not.
      const safe = document.getElementById('safe-link');
      safe.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerType: 'mouse' }));
      await sleep(100);

      const urlScoped = [...document.querySelectorAll('script[type="speculationrules"]')]
        .map(el => { try { return JSON.parse(el.textContent); } catch (_) { return null; } })
        .filter(Boolean)
        .flatMap(rules => [...(rules.prefetch || []), ...(rules.prerender || [])])
        .find(rule => Array.isArray(rule.urls)
          && rule.urls.some(u => String(u).includes('next.html'))
          && rule.eagerness === 'immediate');
      const legacyLink = document.querySelector('link[rel="prefetch"]');

      if (urlScoped) {
        pass('pointerdown-prefetch', `url-scoped ${urlScoped.urls[0]}`);
      } else if (legacyLink && legacyLink.href.includes('next.html')) {
        pass('pointerdown-prefetch', `legacy ${legacyLink.href}`);
      } else {
        fail('pointerdown-prefetch', `no url-scoped rule; link=${legacyLink && legacyLink.href}`);
      }

      // 6b) Media priority — images beyond the eager budget are lazied as they
      // are inserted, without waiting for layout. Deliberately positioned
      // in-viewport so the layout pass (which lazies anything below the fold)
      // cannot mask a broken ordering heuristic.
      const mediaHost = document.createElement('div');
      mediaHost.style.cssText = 'position:absolute; top:0; left:0;';
      document.body.appendChild(mediaHost);
      const inserted = [];
      for (let i = 0; i < 8; i++) {
        const img = document.createElement('img');
        img.src = `./assets/pixel.png?i=${i}`;
        img.width = 10;
        img.height = 10;
        mediaHost.appendChild(img);
        inserted.push(img);
      }
      await sleep(150);
      const lazyFlags = inserted.map(img => img.getAttribute('loading') === 'lazy');
      // The first MEDIA_EAGER_IMAGE_COUNT (4) images of a page are the ones
      // that might be the hero, so they must keep default loading.
      const eagerHead = lazyFlags.slice(0, 4).every(v => v === false);
      const lazyTail = lazyFlags.slice(4).every(v => v === true);
      const lowPriority = inserted.slice(4).every(img => img.getAttribute('fetchpriority') === 'low');
      if (eagerHead && lazyTail && lowPriority) {
        pass('media-priority', 'first 4 eager, rest lazy + deprioritised');
      } else {
        const dump = inserted.map(img => img.getAttribute('loading') || '-').join(' ');
        fail('media-priority', `flags=${JSON.stringify(lazyFlags)} dump=${dump}`);
      }

      // 7) preconnect/dns-prefetch on hover of external
      const ext = document.getElementById('ext-link');
      ext.dispatchEvent(new PointerEvent('pointerover', { bubbles: true, cancelable: true, pointerType: 'mouse' }));
      await sleep(100);
      const dns = [...document.querySelectorAll('link[rel="dns-prefetch"]')].some(l => l.href.includes('example.com'));
      const pre = [...document.querySelectorAll('link[rel="preconnect"]')].some(l => l.href.includes('example.com'));
      if (dns && pre) pass('dns-preconnect', 'example.com warmed');
      else fail('dns-preconnect', `dns=${dns} preconnect=${pre}`);

      // 8) Coalescing — prove that two identical callers cause one request.
      const coalesceUrl = new URL('./dynamic/coalesce.js', location.href).href;
      const coalesceCache = await caches.open('tm-smart-lru-v3');
      await coalesceCache.delete(coalesceUrl).catch(() => {});
      const [a, b] = await Promise.all([
        fetch(coalesceUrl, { credentials: 'same-origin' }),
        fetch(coalesceUrl, { credentials: 'same-origin' })
      ]);
      const [at, bt] = await Promise.all([a.text(), b.text()]);
      const coalesceCount = await requestCount('coalesce');
      if (a.ok && b.ok && at === bt && coalesceCount === 1) {
        pass('coalesce-parallel', 'one network request for two callers');
      } else {
        fail('coalesce-parallel', `a=${a.status} b=${b.status} requests=${coalesceCount}`);
      }

      // 9) Requests with different headers must never share a flight. The
      // response declares Vary, but coalescing happens before that is known.
      const variantUrl = new URL('./dynamic/variant.js', location.href).href;
      const [variantA, variantB] = await Promise.all([
        fetch(variantUrl, { headers: { 'X-QS-Variant': 'A' } }),
        fetch(variantUrl, { headers: { 'X-QS-Variant': 'B' } })
      ]);
      const [variantAText, variantBText] = await Promise.all([variantA.text(), variantB.text()]);
      if (variantAText.includes('"A"') && variantBText.includes('"B"')) {
        pass('coalesce-request-isolation', 'different headers kept separate');
      } else {
        fail('coalesce-request-isolation', `A=${variantAText.trim()} B=${variantBText.trim()}`);
      }

      // 10) Detaching the shared network flight must not delay an individual
      // caller's AbortSignal rejection until the slow response completes.
      const slowUrl = new URL(`./dynamic/slow.js?t=${Date.now()}`, location.href).href;
      const controller = new AbortController();
      const abortStartedAt = performance.now();
      const slowFetch = fetch(slowUrl, { signal: controller.signal });
      setTimeout(() => controller.abort(), 50);
      try {
        await slowFetch;
        fail('abort-promptly', 'fetch resolved after abort');
      } catch (error) {
        const abortElapsed = performance.now() - abortStartedAt;
        if (controller.signal.aborted && abortElapsed < 500) {
          pass('abort-promptly', `rejected in ${Math.round(abortElapsed)}ms`);
        } else {
          fail('abort-promptly', `elapsed=${Math.round(abortElapsed)}ms error=${String(error)}`);
        }
      }

      // 10b) Aborting one of two coalesced callers must reject only that
      // caller while its sibling receives the single shared response.
      const sharedSlowUrl = new URL(`./dynamic/slow-shared.js?t=${Date.now()}`, location.href).href;
      const sharedController = new AbortController();
      const sharedAbortStartedAt = performance.now();
      const abortingCaller = fetch(sharedSlowUrl, { signal: sharedController.signal }).then(
        response => ({ resolved: true, response }),
        error => ({ resolved: false, error, elapsed: performance.now() - sharedAbortStartedAt })
      );
      const siblingCaller = fetch(sharedSlowUrl);
      setTimeout(() => sharedController.abort(), 50);
      const [abortedCallerResult, siblingResponse] = await Promise.all([abortingCaller, siblingCaller]);
      const siblingBody = await siblingResponse.text();
      const sharedRequestCount = await requestCount('coalesce-abort');
      if (!abortedCallerResult.resolved
          && sharedController.signal.aborted
          && abortedCallerResult.elapsed < 500
          && siblingResponse.ok
          && siblingBody.includes('__qsSlowShared')
          && sharedRequestCount === 1) {
        pass('coalesce-abort-isolation', `abort=${Math.round(abortedCallerResult.elapsed)}ms requests=1`);
      } else {
        fail(
          'coalesce-abort-isolation',
          `resolved=${abortedCallerResult.resolved} elapsed=${Math.round(abortedCallerResult.elapsed || 0)} sibling=${siblingResponse.status} requests=${sharedRequestCount}`
        );
      }

      // 10c) An explicitly null RequestInit.signal detaches the signal carried
      // by the input Request instead of accidentally inheriting it.
      const detachUrl = new URL(`./dynamic/slow-shared.js?detached=${Date.now()}`, location.href).href;
      const inheritedController = new AbortController();
      const requestWithSignal = new Request(detachUrl, { signal: inheritedController.signal });
      const detachedFetch = fetch(requestWithSignal, { signal: null });
      setTimeout(() => inheritedController.abort(), 50);
      try {
        const detachedResponse = await detachedFetch;
        const detachedBody = await detachedResponse.text();
        if (detachedResponse.ok && detachedBody.includes('__qsSlowShared')) {
          pass('explicit-null-signal', 'input Request signal was detached');
        } else {
          fail('explicit-null-signal', `status=${detachedResponse.status}`);
        }
      } catch (error) {
        fail('explicit-null-signal', `unexpected rejection: ${error && error.name || error}`);
      }

      // 11) Preserve native only-if-cached semantics: a unique cache miss must
      // not be converted into a network request by the userscript wrapper.
      const cacheModeBefore = await requestCount('cache-mode');
      const cacheModeUrl = new URL(`./dynamic/cache-mode.js?t=${Date.now()}`, location.href).href;
      try {
        const onlyCached = await fetch(cacheModeUrl, { mode: 'same-origin', cache: 'only-if-cached' });
        await onlyCached.arrayBuffer();
      } catch (_) {}
      await sleep(100);
      const cacheModeAfter = await requestCount('cache-mode');
      if (cacheModeAfter === cacheModeBefore) {
        pass('native-cache-mode', 'only-if-cached caused no network request');
      } else {
        fail('native-cache-mode', `requests before=${cacheModeBefore} after=${cacheModeAfter}`);
      }

      // 12) A followed redirect must be cached under the original request URL,
      // because that is the key subsequent callers will look up.
      const redirectBefore = await requestCount('redirect');
      const redirectTargetBefore = await requestCount('redirect-target');
      const redirectUrl = new URL(`./dynamic/redirect.js?t=${Date.now()}`, location.href).href;
      const redirectFirst = await fetch(redirectUrl);
      const redirectFirstBody = await redirectFirst.text();
      const redirectStored = await waitFor(async () => {
        const currentCache = await caches.open('tm-smart-lru-v3');
        return Boolean(await currentCache.match(redirectUrl));
      }, 3000, 50);
      const redirectSecond = await fetch(redirectUrl);
      const redirectSecondBody = await redirectSecond.text();
      const redirectAfter = await requestCount('redirect');
      const redirectTargetAfter = await requestCount('redirect-target');
      if (redirectStored
          && redirectFirst.ok
          && redirectSecond.ok
          && redirectFirstBody === redirectSecondBody
          && redirectAfter === redirectBefore + 1
          && redirectTargetAfter === redirectTargetBefore + 1) {
        pass('redirect-original-key', 'second original-URL fetch served from Cache API');
      } else {
        fail(
          'redirect-original-key',
          `stored=${redirectStored} redirectRequests=${redirectAfter - redirectBefore} targetRequests=${redirectTargetAfter - redirectTargetBefore}`
        );
      }

      // 13) Purging must invalidate the memoized Cache handle. Otherwise later
      // writes can disappear into the deleted Cache object until page reload.
      const purgeCommand = (window.__QS_MENU__ || []).find(command => command.label.startsWith('Purge Asset Cache'));
      if (purgeCommand) {
        await purgeCommand.fn();
        const afterPurgeUrl = new URL(`./dynamic/coalesce.js?after-purge=${Date.now()}`, location.href).href;
        const afterPurgeResponse = await fetch(afterPurgeUrl);
        await afterPurgeResponse.text();
        const afterPurgeStored = await waitFor(async () => {
          const currentCache = await caches.open('tm-smart-lru-v3');
          return Boolean(await currentCache.match(afterPurgeUrl));
        }, 3000, 50);
        if (afterPurgeStored) pass('purge-cache-handle-reset', 'new writes remain visible after purge');
        else fail('purge-cache-handle-reset', 'post-purge write used a deleted Cache handle');
      } else {
        fail('purge-cache-handle-reset', 'purge menu command not registered');
      }

    } catch (err) {
      fail('harness-exception', String(err && err.stack || err));
    }

    const failed = results.filter(r => !r.ok);
    const lines = results.map(r => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? ' — ' + r.detail : ''}`);
    lines.push('');
    lines.push(failed.length ? `FAILED ${failed.length}/${results.length}` : `ALL PASSED (${results.length})`);
    out.textContent = lines.join('\n');
    out.classList.toggle('fail', failed.length > 0);
    document.title = failed.length ? `FAIL ${failed.length}` : `PASS ${results.length}`;
    window.__QS_TEST_RESULTS__ = { passed: results.length - failed.length, failed: failed.length, results };
  </script>
</body>
</html>
